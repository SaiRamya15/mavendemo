version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo Installing Maven...
      - mvn --version
      - echo Installing SSH tools...
      - yum install -y openssh-clients
      - echo Decoding private key...
      - echo "$EC2_KEY" | base64 -d > ec2_key.pem
      - chmod 400 ec2_key.pem

  build:
    commands:
      - echo Building the application...
      - mvn clean package

  post_build:
    commands:
      - echo Deploying to EC2...
      - scp -i ec2_key.pem target/*.jar $EC2_HOST:/home/ec2-user/
      - ssh -o StrictHostKeyChecking=no -i ec2_key.pem $EC2_HOST "pkill -f 'java -jar' || true && nohup java -jar /home/ec2-user/*.jar > app.log 2>&1 &"
      - echo Deployment complete!

artifacts:
  base-directory: target
  files:
    - '*.jar'
